name: Release package

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Publish
    runs-on: ubuntu-22.04
    if: "startsWith(github.event.head_commit.message, 'chore: release')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: 4.0.7
          bundler-cache: true

      - name: Install CocoaPods
        run: gem install cocoapods

      # CocoaPods trunk is going read-only: a failed push must not fail the release.
      - name: Publish on CocoaPods
        id: cocoapods
        continue-on-error: true
        run: |
          set -eo pipefail
          version=$(sed -n "s/.*s\.version = '\(.*\)'.*/\1/p" AlgoliaSearchClient.podspec)
          if curl -sf https://trunk.cocoapods.org/api/v1/pods/AlgoliaSearchClient | jq -e --arg v "$version" '.versions[] | select(.name == $v)' > /dev/null; then
            echo "AlgoliaSearchClient $version is already on CocoaPods, skipping the push"
            exit 0
          fi
          pod trunk push --allow-warnings --verbose AlgoliaSearchClient.podspec
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}

      - name: Warn when the CocoaPods publish failed
        if: steps.cocoapods.outcome == 'failure'
        run: echo "::warning title=release-warning: CocoaPods publish failed::AlgoliaSearchClient was not pushed to CocoaPods trunk; the release itself is unaffected (SwiftPM is the primary distribution)."
